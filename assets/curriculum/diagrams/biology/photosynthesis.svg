<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Photosynthesis in a leaf: light, carbon dioxide and water in; glucose and oxygen out">
  <rect width="520" height="300" fill="#F0FDF4"/>
  <text x="260" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#166534">Photosynthesis in a leaf</text>

  <!-- Sun and light -->
  <circle cx="62" cy="64" r="26" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
  <text x="62" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#854D0E">Sun</text>
  <line x1="92" y1="78" x2="188" y2="118" stroke="#EAB308" stroke-width="3"/>
  <polygon points="196,122 182,124 188,112" fill="#EAB308"/>
  <line x1="86" y1="94" x2="170" y2="150" stroke="#EAB308" stroke-width="3"/>
  <polygon points="177,155 163,155 170,144" fill="#EAB308"/>
  <text x="104" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#A16207">Light energy</text>

  <!-- Leaf -->
  <path d="M 170 170 C 210 80, 340 70, 390 150 C 340 230, 220 240, 170 170 Z" fill="#86EFAC" stroke="#15803D" stroke-width="3"/>
  <path d="M 170 170 C 250 160, 320 155, 390 150" fill="none" stroke="#15803D" stroke-width="2"/>
  <path d="M 230 165 L 260 128 M 290 160 L 318 122 M 250 164 L 276 196 M 310 158 L 334 188" fill="none" stroke="#15803D" stroke-width="1.5"/>
  <ellipse cx="282" cy="140" rx="12" ry="7" fill="#22C55E" stroke="#166534" stroke-width="1"/>
  <ellipse cx="240" cy="144" rx="10" ry="6" fill="#22C55E" stroke="#166534" stroke-width="1"/>
  <text x="282" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#14532D">Chloroplasts (chlorophyll)</text>
  <text x="282" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#14532D">Glucose made</text>
  <text x="282" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#14532D">stored as starch</text>

  <!-- Carbon dioxide in -->
  <line x1="40" y1="200" x2="150" y2="186" stroke="#475569" stroke-width="3"/>
  <polygon points="160,185 147,193 146,179" fill="#475569"/>
  <text x="70" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#334155">Carbon dioxide in</text>
  <text x="70" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#334155">through stomata</text>

  <!-- Water in -->
  <line x1="262" y1="290" x2="262" y2="228" stroke="#2563EB" stroke-width="3"/>
  <polygon points="262,218 255,231 269,231" fill="#2563EB"/>
  <text x="330" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">Water in</text>
  <text x="330" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1D4ED8">from roots, in xylem</text>

  <!-- Oxygen out -->
  <line x1="398" y1="140" x2="478" y2="110" stroke="#0891B2" stroke-width="3"/>
  <polygon points="488,106 478,117 473,104" fill="#0891B2"/>
  <text x="460" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#0E7490">Oxygen out</text>
  <text x="460" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#0E7490">through stomata</text>

  <!-- Equation -->
  <rect x="370" y="210" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="440" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#14532D">carbon dioxide + water</text>
  <text x="440" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#14532D">→ glucose + oxygen</text>
</svg>
