name: Build Africa AI Connect APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check code
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        env:
          AI_BACKEND_URL: ${{ vars.AI_BACKEND_URL }}
        run: |
          if [ -n "$AI_BACKEND_URL" ]; then
            echo "Building with configured AI backend."
            flutter build apk --debug \
              --dart-define=AI_BACKEND_URL="$AI_BACKEND_URL"
          else
            echo "No AI_BACKEND_URL configured. Building offline-first APK."
            flutter build apk --debug
          fi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/Africa-AI-Connect-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Africa-AI-Connect-APK
          path: build/app/outputs/flutter-apk/Africa-AI-Connect-debug.apk
          if-no-files-found: error
          retention-days: 14
