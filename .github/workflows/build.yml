name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (Drift, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Validate production backend URL
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          if [[ -z "$BACKEND_BASE_URL" || "$BACKEND_BASE_URL" != https://* ]]; then
            echo "Set the repository variable BACKEND_BASE_URL to the public HTTPS FastAPI URL."
            exit 1
          fi

      - name: Build release APK (split per ABI)
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: flutter build apk --release --split-per-abi --dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL"

      - name: Upload arm64 APK (main target)
        uses: actions/upload-artifact@v4
        with:
          name: africa-ai-connect-v${{ github.run_number }}-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload armeabi APK (older devices)
        uses: actions/upload-artifact@v4
        with:
          name: africa-ai-connect-v${{ github.run_number }}-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
