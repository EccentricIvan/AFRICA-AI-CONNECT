name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build release APKs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GRADLE_OPTS: >-
            -Xmx3072m
            -Dorg.gradle.daemon=false
            -Dkotlin.daemon.jvm.options=-Xmx1024m
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --no-tree-shake-icons \
            --dart-define=GROQ_API_KEY="${GROQ_API_KEY:-}"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: africa-ai-connect-v${{ github.run_number }}-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: africa-ai-connect-v${{ github.run_number }}-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
